name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: lxe-linux
            binary: lxe
          - os: windows-latest
            artifact: lxe-windows
            binary: lxe.exe
          - os: macos-latest
            artifact: lxe-macos
            binary: lxe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.341.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir -p staging
          find build -name "${{ matrix.binary }}" -type f | head -1 | xargs -I{} cp {} staging/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.binary }}
